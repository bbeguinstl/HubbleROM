name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug = Pixeldrain only, test = + GitHub release, release = + OTA XML)'
        type: choice
        options:
          - debug
          - test
          - release
        default: debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [y2slte]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr brotli ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            python-is-python3 python3 wget curl unzip

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

          wget https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py && sudo ln -sf $(pwd)/mkbootimg.py /usr/bin/mkbootimg && chmod +x /usr/bin/mkbootimg

          # The hosted runner's AWS kernel has no linux-modules-extra package
          # in the apt mirror. The ROM tools parse/build these images in
          # userspace, so loading optional host modules must not block setup.
          sudo modprobe erofs 2>/dev/null || true
          sudo modprobe f2fs 2>/dev/null || true

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Compute ROM tools cache key
        id: rom-tools-cache-key
        run: |
          TOOL_CACHE_KEY="$( {
            git submodule status --recursive
            sha256sum scripts/build_dependencies.sh \
              external/patches/apktool/0001-feat-support-aapt-optimization.patch
            clang --version | sed -n '1p'
            cmake --version | sed -n '1p'
            rustc --version
            java -version 2>&1 | sed -n '1p'
          } | sha256sum | cut -c1-20)"
          echo "key=$TOOL_CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache built ROM tools
        uses: actions/cache@v4
        with:
          path: |
            out/tools/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rom-tools-${{ steps.rom-tools-cache-key.outputs.key }}

      - name: Cache decoded and built APKs
        uses: actions/cache@v4
        with:
          path: |
            out/target/y2s/apk_cache
            out/target/y2s/apk_decode_cache
          key: ${{ runner.os }}-rom-y2s-apks-${{ steps.rom-tools-cache-key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-rom-y2s-apks-${{ steps.rom-tools-cache-key.outputs.key }}-

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh ${{ matrix.target }} && ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Add swap space
        run: |
          EXISTING_SWAP=$(swapon --noheadings --show=NAME | head -n 1)
          if [ -n "$EXISTING_SWAP" ]; then
            echo "Keeping runner-provided swap active: $EXISTING_SWAP"
          else
            SWAP_FILE="/swapfile"
            echo "No existing swap found. Creating $SWAP_FILE"
            sudo fallocate -l 12G "$SWAP_FILE"
            sudo chmod 600 "$SWAP_FILE"
            sudo mkswap "$SWAP_FILE"
            sudo swapon "$SWAP_FILE"
          fi

          echo "Swap configured:"
          free -h
          swapon --show
      
      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --use-apk-cache
          
      - name: Split the ROM and publish release assets
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
        run: |
          mkdir -p split_tmp

          for file in out/*.zip; do
            if [ ! -f "$file" ]; then
              echo "No ZIP files found to upload."
              continue
            fi

            FILE_NAME=$(basename "$file")
            FILE_SIZE=$(stat -c%s "$file")
            FILE_MD5=$(md5sum "$file" | awk '{print $1}')
            FILE_SHA256=$(sha256sum "$file" | awk '{print $1}')
            VERSION=$(echo "$FILE_NAME" | grep -oP '\d+\.\d+\.\d+')
            BETA=$(echo "$FILE_NAME" | grep -oP 'beta\d+')
            DEVICE=$(echo "$FILE_NAME" | sed -E 's/.*-([^-]+)_OFFICIAL\.zip/\1/')
            BUILD_DATE=$(date +%Y-%m-%d)

            # Split + GitHub Release for release + test
            PART_LINKS=()
            if [ "$BUILD_TYPE" = "release" ] || [ "$BUILD_TYPE" = "test" ]; then
              echo "Splitting $FILE_NAME into six GitHub-safe parts..."
              cd split_tmp
              split -d -n 6 "../$file" "${FILE_NAME}.part_"
              printf '%s  %s\n' "$FILE_SHA256" "$FILE_NAME" > "${FILE_NAME}.sha256"
              printf '%s\n' \
                "Download all six .part_XX assets, then run:" \
                "cat ${FILE_NAME}.part_* > ${FILE_NAME}" \
                "sha256sum -c ${FILE_NAME}.sha256" \
                > "${FILE_NAME}.HOWTO.txt"
              cd ..

              TAG_NAME="v${VERSION}-${BETA}-${DEVICE}"
              RELEASE_NAME="HubbleROM-${VERSION}-${BETA}-${DEVICE}-${BUILD_DATE}"

              echo "Creating GitHub Release: $RELEASE_NAME"

              RELEASE_DATA=$(jq -n \
                --arg tag "$TAG_NAME" \
                --arg name "$RELEASE_NAME" \
                --arg body "Flashable ZIP: $FILE_NAME. GitHub assets are split into six parts because of the per-file size limit. Download every .part_XX asset and follow the attached HOWTO file to reassemble and verify the ZIP. Known issue: HubbleROM v1.0.0 and v1.0.1 bootloop on y2slte; this release switches the device kernel and vendor base to LineageOS 24." \
                '{ tag_name: $tag, name: $name, body: $body, draft: false, prerelease: true }')

              RELEASE_RESPONSE=$(curl -s -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$RELEASE_DATA" \
                https://api.github.com/repos/$RELEASE_REPO/releases)

              RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
              if [ "$RELEASE_ID" = "null" ]; then
                echo "ERROR: Release not created. Check GH_TOKEN and permissions."
                exit 1
              fi
              echo "Release created: $RELEASE_ID"

              # Upload all parts, checksum, and reassembly instructions
              for part in split_tmp/*; do
                PART_NAME=$(basename "$part")
                UPLOAD_RESPONSE=$(curl -s -X POST \
                  -H "Authorization: token $GH_TOKEN" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @"$part" \
                  "https://uploads.github.com/repos/$RELEASE_REPO/releases/$RELEASE_ID/assets?name=$PART_NAME")
                PART_URL=$(echo "$UPLOAD_RESPONSE" | jq -r '.browser_download_url')
                PART_LINKS+=("$PART_URL")
              done
            fi

            # Generate OTA XML for release only
            if [ "$BUILD_TYPE" = "release" ]; then
              echo "Generating OTA XML..."
              git clone --single-branch --branch seventeen https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} updater_repo
              cd updater_repo
              git checkout seventeen
              mkdir -p updater
              XML_FILE="updater/v2/${{ matrix.target }}.xml"

              {
                echo '<?xml version="1.0" encoding="UTF-8"?>'
                echo '<roms>'
                echo '  <rom channel="stable">'
                echo "    <version>$VERSION</version>"
                echo "    <date>$BUILD_DATE</date>"
                echo "    <filename>$FILE_NAME</filename>"
              } > $XML_FILE

              INDEX=1
              for url in "${PART_LINKS[@]}"; do
                echo "    <part$INDEX>$url</part$INDEX>" >> $XML_FILE
                INDEX=$((INDEX+1))
              done

              {
                echo "    <md5>$FILE_MD5</md5>"
                echo "    <size>$FILE_SIZE</size>"
                echo '  </rom>'
                echo '</roms>'
              } >> $XML_FILE

              git add $XML_FILE
              git commit -m "updater: v2: ${{ matrix.target }}.xml: Update to $VERSION" || true
              git pull --rebase origin seventeen
              git push origin seventeen
              cd ..
            fi
          done
